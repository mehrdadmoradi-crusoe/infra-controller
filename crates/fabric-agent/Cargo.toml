[package]
name = "carbide-fabric-agent"
version = "0.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true

# The fabric agent: serves the `fabric_agent.v1` contract to NICo and renders
# it onto one fabric controller through an in-process adapter (EDA, Hedgehog).
# Runs next to the fabric, operated by the network team, holding the controller
# credentials so NICo never does.

[lib]
name = "carbide_fabric_agent"
path = "src/lib.rs"

[[bin]]
name = "fabric-agent"
path = "src/main.rs"

[dependencies]
carbide-fabric = { path = "../fabric" }
carbide-fabric-agent-api = { path = "../fabric-agent-api" }
async-trait = { workspace = true }
clap = { workspace = true }
eyre = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
x509-parser = { workspace = true }

[lints]
workspace = true
