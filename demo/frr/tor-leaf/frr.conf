frr defaults datacenter
hostname tor-leaf-01
log stdout informational
!
! Border leaf: EVPN transit for the DPUs AND a VTEP holding the customer
! VRF (vrf-blue) for the cloud interconnect handoff. The interconnect is
! nothing special: an eBGP session to the peer cloud inside the customer's
! VRF; routes propagate to/from the DPUs as ordinary EVPN type-5.
!
vrf vrf-blue
 vni 2024549
exit-vrf
vrf vrf-green
 vni 2024536
exit-vrf
!
interface lo
 ip address 10.180.62.3/32
!
! Fabric-side prefix the leaf advertises down to the DPUs
ip route 10.0.100.0/24 blackhole
!
router bgp 65100
 bgp router-id 172.30.0.2
 no bgp ebgp-requires-policy
 neighbor 172.30.0.3 remote-as 65201
 neighbor 172.30.0.3 description dpu-hbn-01
 neighbor 172.30.0.3 bfd
 neighbor 172.30.0.4 remote-as 65202
 neighbor 172.30.0.4 description dpu-hbn-02
 neighbor 172.30.0.4 bfd
 !
 address-family ipv4 unicast
  network 10.0.100.0/24
  redistribute connected
  neighbor 172.30.0.3 activate
  neighbor 172.30.0.4 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 172.30.0.3 activate
  neighbor 172.30.0.3 attribute-unchanged next-hop
  neighbor 172.30.0.4 activate
  neighbor 172.30.0.4 attribute-unchanged next-hop
  advertise-all-vni
 exit-address-family
!
! The interconnect: customer VRF peers with the external cloud.
! Toggle with interconnect-up.sh / interconnect-down.sh (neighbor shutdown).
router bgp 65100 vrf vrf-blue
 !
 neighbor 172.31.0.2 remote-as 16550
 neighbor 172.31.0.2 description gcp-partner-interconnect
 neighbor 172.31.0.2 bfd
 neighbor 172.31.0.2 shutdown
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.31.0.2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
line vty
