frr defaults datacenter
hostname tor-leaf-01
log stdout informational
!
! Fabric-side prefix the leaf advertises down to the DPUs
ip route 10.0.100.0/24 blackhole
!
! The ToR is pure underlay + EVPN transit: it routes VTEP loopbacks and
! relays EVPN routes between DPUs with next-hop (the VTEP) unchanged.
! Tenant prefixes only exist inside EVPN/VXLAN — the ToR never sees them
! in its IPv4 table. Isolation and peering are enforced on the DPUs.
router bgp 65100
 bgp router-id 172.30.0.2
 no bgp ebgp-requires-policy
 neighbor 172.30.0.3 remote-as 65201
 neighbor 172.30.0.3 description dpu-hbn-01
 neighbor 172.30.0.3 bfd
 neighbor 172.30.0.4 remote-as 65202
 neighbor 172.30.0.4 description dpu-hbn-02
 neighbor 172.30.0.4 bfd
 !
 address-family ipv4 unicast
  network 10.0.100.0/24
  neighbor 172.30.0.3 activate
  neighbor 172.30.0.4 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 172.30.0.3 activate
  neighbor 172.30.0.3 attribute-unchanged next-hop
  neighbor 172.30.0.4 activate
  neighbor 172.30.0.4 attribute-unchanged next-hop
 exit-address-family
!
line vty