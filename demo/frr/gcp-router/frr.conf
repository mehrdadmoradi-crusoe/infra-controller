frr defaults datacenter
hostname gcp-cloud-router
log stdout informational
!
! Plays GCP's side of a Partner Interconnect: AS 16550 (the real GCP
! partner ASN), advertising the customer's GCP VPC subnet 10.128.0.0/20
! (the same prefix as the SSI production deployment) to Crusoe's border.
!
router bgp 16550
 bgp router-id 172.31.0.2
 no bgp ebgp-requires-policy
 neighbor 172.31.0.1 remote-as 65100
 neighbor 172.31.0.1 description crusoe-border-leaf
 neighbor 172.31.0.1 bfd
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.31.0.1 activate
 exit-address-family
!
line vty
